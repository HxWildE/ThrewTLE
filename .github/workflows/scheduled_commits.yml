name: Scheduled Timed Commit Worker

on:
  schedule:
    # Run every 4 hours or manually via workflow_dispatch
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      commit_message:
        description: "Custom commit message"
        required: false
        default: "chore(automated): timed repository sync and maintenance"

jobs:
  timed-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "ThrewTLE Bot"
          git config --global user.email "bot@threwtle.local"

      - name: Check for Uncommitted Changes or Staggered Batches
        run: |
          python scripts/timed_commit_worker.py --check-only || true

      - name: Push Staggered Commits if available
        run: |
          python scripts/timed_commit_worker.py --execute || true
